name: "Daily Training Pipeline"

# M2 bounded offline training and evaluation preparation.
# The daily trigger is inert unless the repository owner sets
# ENABLE_DAILY_TRAINING=true. Each run is capped at 60 minutes, preserves
# deterministic seeds and versioned checkpoints, and never promotes weights.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Number of bounded training cycles'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
      seed:
        description: 'Deterministic training seed'
        required: false
        default: '2026'
        type: string
      resume_run_id:
        description: 'Optional prior successful workflow run ID to resume exactly'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  train:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_TRAINING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CYCLES: ${{ github.event.inputs.cycles || '1' }}
      TRAINING_SEED: ${{ github.event.inputs.seed || '2026' }}
      RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          echo "::group::Install base dependencies"
          python -m pip install --upgrade pip
          # Install production dependencies (fastapi, uvicorn, pydantic)
          pip install -r requirements.txt
          echo "::endgroup::"

          echo "::group::Install training dependencies (CPU-only PyTorch)"
          # CPU-only PyTorch to avoid CUDA bloat
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Remaining training deps
          pip install numpy hisss
          echo "::endgroup::"

          echo "::group::Verify installation"
          python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')"
          python -c "import torch; print(f'PyTorch {torch.__version__} (CUDA: {torch.cuda.is_available()})')"
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          python -c "import hisss; print('hisss installed')"
          echo "::endgroup::"

      - name: Restore exact prior-run checkpoints
        if: ${{ env.RESUME_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ env.RESUME_RUN_ID }}
        run: |
          set -euo pipefail
          mkdir restored
          gh run download "$RESUME_RUN_ID" --repo "${{ github.repository }}" --dir restored
          MANIFEST=$(find restored -type f -name continuity-manifest.json -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Run $RESUME_RUN_ID has no versioned checkpoint artifact"
            exit 1
          fi
          RESTORED_ROOT=$(dirname "$MANIFEST")
          python training/continuity.py validate \
            --root "$RESTORED_ROOT" \
            --expected-seed ${{ env.TRAINING_SEED }} \
            --required-path checkpoint.json \
            --required-path neural/latest.pt
          mkdir -p training/checkpoints
          cp -R "$RESTORED_ROOT"/. training/checkpoints/
          echo "Restored and validated checkpoints from workflow run $RESUME_RUN_ID"

      - name: Run training cycles
        run: |
          set -o pipefail

          CYCLES="$CYCLES"
          echo "=========================================="
          echo "Daily Training Pipeline"
          echo "Cycles: $CYCLES"
          echo "Runner: ubuntu-latest (2-core, 7GB RAM)"
          echo "=========================================="
          echo ""

          TOTAL_START=$(date +%s)

          for i in $(seq 1 $CYCLES); do
            echo ""
            echo "=========================================="
            echo "CYCLE $i of $CYCLES"
            echo "=========================================="
            echo ""

            CYCLE_START=$(date +%s)

            # Neural Self-Play (~11 minutes)
            echo "--- Phase 1: Neural PPO Self-Play ---"
            NEURAL_START=$(date +%s)

            # Use --resume for cycle 2+ to continue from previous checkpoint
            if [ $i -eq 1 ] && [ -z "${{ env.RESUME_RUN_ID }}" ]; then
              python training/neural_selfplay.py \
                --updates 5 \
                --games-per-update 16 \
                --workers 2 \
                --device cpu \
                --seed ${{ env.TRAINING_SEED }} \
                2>&1 | tee -a training_cycle_${i}_neural.log
              NEURAL_EXIT=${PIPESTATUS[0]}
            else
              python training/neural_selfplay.py \
                --updates 5 \
                --games-per-update 16 \
                --workers 2 \
                --device cpu \
                --seed ${{ env.TRAINING_SEED }} \
                --resume \
                2>&1 | tee -a training_cycle_${i}_neural.log
              NEURAL_EXIT=${PIPESTATUS[0]}
            fi

            NEURAL_END=$(date +%s)
            NEURAL_ELAPSED=$((NEURAL_END - NEURAL_START))

            echo "Neural phase completed: ${NEURAL_ELAPSED}s (exit code: $NEURAL_EXIT)"

            if [ $NEURAL_EXIT -ne 0 ]; then
              echo "::error::Neural self-play failed in cycle $i"
              exit 1
            fi

            # Tactical Hisss (~76 minutes)
            echo ""
            echo "--- Phase 2: Tactical Weights (hisss) ---"
            HISSS_START=$(date +%s)

            # Use --resume for cycle 2+ to continue from previous checkpoint
            if [ $i -eq 1 ] && [ -z "${{ env.RESUME_RUN_ID }}" ]; then
              python training/train_hisss.py \
                --minutes 5 \
                --workers 2 \
                --seed ${{ env.TRAINING_SEED }} \
                2>&1 | tee -a training_cycle_${i}_hisss.log
              HISSS_EXIT=${PIPESTATUS[0]}
            else
              python training/train_hisss.py \
                --minutes 5 \
                --workers 2 \
                --seed ${{ env.TRAINING_SEED }} \
                --resume \
                2>&1 | tee -a training_cycle_${i}_hisss.log
              HISSS_EXIT=${PIPESTATUS[0]}
            fi

            HISSS_END=$(date +%s)
            HISSS_ELAPSED=$((HISSS_END - HISSS_START))

            echo "Hisss phase completed: ${HISSS_ELAPSED}s (exit code: $HISSS_EXIT)"

            if [ $HISSS_EXIT -ne 0 ]; then
              echo "::error::Tactical training failed in cycle $i"
              exit 1
            fi

            CYCLE_END=$(date +%s)
            CYCLE_ELAPSED=$((CYCLE_END - CYCLE_START))
            CYCLE_MINUTES=$((CYCLE_ELAPSED / 60))
            CYCLE_SECONDS=$((CYCLE_ELAPSED % 60))
            echo ""
            echo "Cycle $i completed: ${CYCLE_MINUTES}m ${CYCLE_SECONDS}s total"
            echo ""
          done

          TOTAL_END=$(date +%s)
          TOTAL_ELAPSED=$((TOTAL_END - TOTAL_START))
          TOTAL_MINUTES=$((TOTAL_ELAPSED / 60))
          TOTAL_SECONDS=$((TOTAL_ELAPSED % 60))

          echo "=========================================="
          echo "Training Pipeline Complete"
          echo "Total time: ${TOTAL_MINUTES}m ${TOTAL_SECONDS}s"
          echo "=========================================="

          # Summary for GitHub Actions UI
          echo "### 🎯 Training Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cycles completed**: $CYCLES" >> $GITHUB_STEP_SUMMARY
          echo "- **Total time**: ${TOTAL_MINUTES}m ${TOTAL_SECONDS}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Checkpoints saved**: training/checkpoints/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Weights NOT auto-promoted** - checkpoints saved for manual review" >> $GITHUB_STEP_SUMMARY

      - name: Write versioned continuity manifest
        if: success()
        run: |
          ORIGIN="fresh"
          if [ -n "$RESUME_RUN_ID" ]; then ORIGIN="workflow-run:$RESUME_RUN_ID"; fi
          python training/continuity.py write \
            --root training/checkpoints \
            --seed ${{ env.TRAINING_SEED }} \
            --run-id "${{ github.run_id }}" \
            --source-sha "${{ github.sha }}" \
            --trainer neural-ppo \
            --trainer tactical-hisss \
            --configuration-json '{"cycles":${{ env.CYCLES }},"neural_updates":5,"games_per_update":16,"tactical_minutes":5,"workers":2,"device":"cpu"}' \
            --checkpoint-origin "$ORIGIN"
          python training/continuity.py validate --root training/checkpoints

      - name: Upload training checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-checkpoints-${{ github.run_number }}
          path: |
            training/checkpoints/**/*.json
            training/checkpoints/**/*.pt
            training/checkpoints/continuity-manifest.json
          retention-days: 30

      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs-${{ github.run_number }}
          path: |
            training_cycle_*.log
            training/checkpoints/continuity-manifest.json
          retention-days: 30

      - name: Training report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`training-checkpoints-${{ github.run_number }}\`: Neural (.pt) and tactical (.json) checkpoints" >> $GITHUB_STEP_SUMMARY
          echo "- \`training-logs-${{ github.run_number }}\`: Full training logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review checkpoint quality metrics" >> $GITHUB_STEP_SUMMARY
          echo "2. Run validation/benchmark tests" >> $GITHUB_STEP_SUMMARY
          echo "3. Manually promote best checkpoint with \`--promote\` flag" >> $GITHUB_STEP_SUMMARY
